<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كيان - الحضور والانصراف</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--g:#1d6f5f}
body{font-family:Tahoma,Arial,sans-serif;background:#f4f4f9;margin:0;padding:16px}
header{background:var(--g);color:#fff;padding:12px 16px;border-radius:8px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
header h1{margin:0;font-size:20px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:#ffffff33}
nav button.on{background:#fff;color:var(--g)}
section{display:none;background:#fff;padding:16px;border-radius:8px;margin-top:12px;box-shadow:0 1px 4px #0002}
section.on{display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input,select{padding:8px;border:1px solid #ccc;border-radius:5px;font-family:inherit}
button,.btn{padding:8px 14px;background:var(--g);color:#fff;border:0;border-radius:5px;cursor:pointer;font-weight:bold;font-family:inherit;display:inline-block}
button.d{background:#b3261e}
button.s{background:#555}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;text-align:right;border-bottom:1px solid #eee}
th{background:#f8f9fa}
#msg{margin:10px 0 0;color:#145245;white-space:pre-line}
#ptitle{display:none}
@media print{
  body{background:#fff;padding:0}
  header,.bar,#msg{display:none}
  section{display:none;box-shadow:none;padding:0}
  section.on{display:block}
  #ptitle{display:block;font-size:18px;margin:0 0 8px}
  th,td{font-size:12px;padding:4px}
}
#login{max-width:340px;margin:60px auto;background:#fff;padding:20px;border-radius:8px;box-shadow:0 1px 4px #0002}
#login input{width:100%;box-sizing:border-box;margin-bottom:10px}
.hide{display:none!important}
</style>
</head>
<body>
<div id="login" class="hide">
  <h2>تسجيل الدخول</h2>
  <input id="lu" placeholder="اسم المستخدم" autocomplete="username">
  <input id="lp" type="password" placeholder="كلمة السر" autocomplete="current-password">
  <button id="lg" style="width:100%">دخول</button>
  <div id="lm" style="color:#b3261e;margin-top:8px"></div>
</div>
<div id="app" class="hide">
<header>
  <h1>كيان</h1>
  <nav>
    <button data-t="t1" class="on">الموظفين</button>
    <button data-t="t2">ملفات البصمة</button>
    <button data-t="t3">التقارير</button>
    <button data-t="t4">غير المسجلين</button>
    <button data-t="t5">المستخدمين</button>
  </nav>
  <span id="who" style="margin-inline-start:auto"></span><button class="s" id="lo">خروج</button>
</header>
<div id="msg"></div>

<section id="t1" class="on">
  <div class="bar">
    <input id="ec" placeholder="الكود">
    <input id="en" placeholder="الاسم">
    <input id="ed" list="dl" placeholder="القسم"><datalist id="dl"></datalist>
    <button id="save">حفظ</button>
    <button class="s" id="clr">مسح</button>
    <label class="btn">استيراد من إكسيل (الكود | الاسم | القسم)<input type="file" id="xl" accept=".xlsx,.xls,.csv" hidden></label>
  </div>
  <div class="bar">
    <select id="fd"></select>
    <input id="q" placeholder="بحث بالكود أو الاسم">
  </div>
  <table><thead><tr><th>الكود<th>الاسم<th>القسم<th></tr></thead><tbody id="eb"></tbody></table>
</section>

<section id="t2">
  <div class="bar">
    <label class="btn">رفع ملفات بصمة<input type="file" id="pf" multiple accept=".xlsx,.xls,.csv,.txt,.dat" hidden></label>
  </div>
  <table><thead><tr><th>الملف<th>تاريخ الرفع<th>عدد البصمات<th>الجديد<th>المكرر<th></tr></thead><tbody id="fb"></tbody></table>
</section>

<section id="t3">
  <div class="bar">
    <select id="rp"><option value="d">يومي<option value="m" selected>شهري (21 إلى 21)<option value="c">فترة مخصصة</select>
    <input type="date" id="rd"><input type="month" id="rm">
    <label>من <input type="date" id="rf"></label>
    <label>إلى <input type="date" id="rt"></label>
  </div>
  <div class="bar">
    <select id="rk"><option value="sum">ملخص<option value="pun">بصمات<option value="att">حضور</select>
    <select id="rdp"></select>
    <select id="rs"><option value="all">كل البصمات<option value="known">المسجلين فقط<option value="unknown">غير المسجلين فقط</select>
    <input id="rc" placeholder="كود موظف (اختياري)" size="16">
    <button id="go">عرض</button>
    <button class="s" id="pr">طباعة</button>
  </div>
  <h2 id="ptitle"></h2>
  <div id="rb"></div>
</section>

<section id="t4">
  <p>أكواد ظهرت في ملفات البصمة ومش موجودة في بيانات الموظفين:</p>
  <table><thead><tr><th>الكود<th>عدد البصمات<th>أول بصمة<th>آخر بصمة<th></tr></thead><tbody id="ub"></tbody></table>
</section>

<section id="t5">
  <div class="bar">
    <input id="nu" placeholder="اسم المستخدم (إنجليزي)">
    <input id="np" type="password" placeholder="كلمة السر (8 حروف على الأقل)">
    <select id="nr"><option value="viewer">مستخدم عادي (تقارير فقط)<option value="admin">مدير (كل الصلاحيات)</select>
    <button id="nadd">إضافة مستخدم</button>
  </div>
  <table><thead><tr><th>المستخدم<th>الصلاحية<th>الحالة<th></tr></thead><tbody id="usb"></tbody></table>
</section>
</div>

<script>
const $ = id => document.getElementById(id), p2 = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let EMPS = [];
const say = t => $('msg').textContent = t || '';
const run = f => async (...a) => { try { say(); await f(...a); } catch (e) { say('❌ ' + e.message); } };

async function api(url, method = 'GET', body) {
  const r = await fetch('/api' + url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401 && url !== '/login') { showLogin(); throw new Error('سجّل الدخول'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'حصل خطأ');
  return d;
}

// ---------- التنقل ----------
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.t));
function show(t) {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x.dataset.t === t));
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === t));
  say();
  if (t === 't2') run(loadFiles)();
  if (t === 't4') run(loadUnknown)();
  if (t === 't5') run(loadUsers)();
}

// ---------- قراءة إكسيل ----------
async function sheetsRows(f) {
  const wb = XLSX.read(await f.arrayBuffer(), { cellDates: true });
  return wb.SheetNames.flatMap(n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, dateNF: 'yyyy-mm-dd hh:mm', defval: '' }));
}

// ---------- 1) الموظفين ----------
async function loadEmps() {
  EMPS = await api('/employees');
  const ds = [...new Set(EMPS.map(e => e.dept).filter(Boolean))].sort();
  $('dl').innerHTML = ds.map(d => `<option value="${esc(d)}">`).join('');
  for (const id of ['fd', 'rdp']) {
    const cur = $(id).value;
    $(id).innerHTML = '<option value="">كل الأقسام</option>' + ds.map(d => `<option>${esc(d)}</option>`).join('');
    $(id).value = cur;
  }
  drawEmps();
}
function drawEmps() {
  const q = $('q').value.trim().toLowerCase(), d = $('fd').value;
  $('eb').innerHTML = EMPS.filter(e => (!d || e.dept === d) && (!q || (e.code + ' ' + e.name).toLowerCase().includes(q)))
    .map(e => `<tr><td>${esc(e.code)}<td>${esc(e.name)}<td>${esc(e.dept || '-')}<td><button class="s" data-e="${esc(e.code)}">تعديل</button> <button class="d" data-x="${esc(e.code)}">حذف</button></tr>`).join('')
    || '<tr><td colspan="4">لا يوجد موظفين</tr>';
}
$('q').oninput = drawEmps;
$('fd').onchange = drawEmps;
const clr = () => ['ec', 'en', 'ed'].forEach(i => $(i).value = '');
$('clr').onclick = clr;
$('save').onclick = run(async () => {
  const code = $('ec').value.trim(), name = $('en').value.trim();
  if (!code || !name) return say('الكود والاسم مطلوبين');
  await api('/employees', 'POST', { code, name, dept: $('ed').value });
  clr(); await loadEmps(); say('✅ تم الحفظ');
});
$('eb').onclick = run(async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.e) {
    const x = EMPS.find(v => v.code === b.dataset.e);
    $('ec').value = x.code; $('en').value = x.name; $('ed').value = x.dept || '';
  } else if (confirm('حذف الموظف ' + b.dataset.x + '؟')) {
    await api('/employees/' + encodeURIComponent(b.dataset.x), 'DELETE'); await loadEmps();
  }
});
$('xl').onchange = run(async e => {
  const f = e.target.files[0]; if (!f) return;
  const rows = (await sheetsRows(f))
    .filter(r => r[0] && r[1] && !/^(كود|الكود|code)$/i.test(String(r[0]).trim()))
    .map(r => ({ code: r[0], name: r[1], dept: r[2] }));
  e.target.value = '';
  const r = await api('/employees/bulk', 'POST', { rows });
  await loadEmps(); say(`✅ تم استيراد ${r.count} موظف (الأقسام اتضافت لقائمة الفلترة)`);
});

// ---------- 2) ملفات البصمة ----------
const R1 = /(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})[T\s]+(\d{1,2}):(\d{2})/, R2 = /(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})[T\s]+(\d{1,2}):(\d{2})/;
function parseRow(cells) {
  const c = cells.map(x => String(x ?? '').trim()).filter(Boolean), t = c.join(' ');
  let y, mo, d, h, mi, m = t.match(R1);
  if (m) { [, y, mo, d, h, mi] = m; } else if (m = t.match(R2)) { [, d, mo, y, h, mi] = m; } else return null;
  const code = c.find(x => /^[A-Za-z0-9]+$/.test(x)); // أول خانة كود (أرقام/حروف)
  if (!code) return null;
  return { code, time: `${y}-${p2(mo)}-${p2(d)} ${p2(h)}:${mi}` };
}
async function readPunches(f) {
  const ext = f.name.split('.').pop().toLowerCase();
  const rows = /^xlsx?$/.test(ext) ? await sheetsRows(f) : (await f.text()).split(/\r?\n/).map(l => l.split(/[\t,;]+/));
  return rows.map(parseRow).filter(Boolean);
}
async function loadFiles() {
  const f = await api('/files');
  $('fb').innerHTML = f.map(x => `<tr><td>${esc(x.name)}<td>${x.uploaded}<td>${x.rows_total}<td>${x.rows_new}<td>${x.rows_total - x.rows_new}<td><button class="d" data-f="${x.id}">حذف</button></tr>`).join('')
    || '<tr><td colspan="6">لا توجد ملفات</tr>';
}
$('pf').onchange = run(async e => {
  const fs = [...e.target.files]; e.target.value = ''; const out = [];
  for (const f of fs) {
    const rows = await readPunches(f);
    if (!rows.length) { out.push(`⚠️ ${f.name}: مش لاقي بصمات في الملف`); continue; }
    const r = await api('/files', 'POST', { name: f.name, rows });
    out.push(`✅ ${f.name}: ${r.total} بصمة — جديد ${r.added} — مكرر ${r.duplicates}`);
  }
  await loadFiles(); say(out.join('\n'));
});
$('fb').onclick = run(async e => {
  const b = e.target.closest('button');
  if (b && confirm('حذف الملف وكل البصمات اللي دخلت منه؟')) { await api('/files/' + b.dataset.f, 'DELETE'); await loadFiles(); }
});

// ---------- 3) التقارير ----------
const ymd = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
const hm = h => { const m = Math.round(h * 60); return Math.floor(m / 60) + ':' + p2(m % 60); };
function period() {
  const t = $('rp').value;
  $('rd').style.display = t === 'd' ? '' : 'none';
  $('rm').style.display = t === 'm' ? '' : 'none';
  if (t === 'd') { $('rf').value = $('rt').value = $('rd').value; }
  if (t === 'm' && $('rm').value) { // من 21 الشهر السابق إلى 21 الشهر المختار
    const [y, m] = $('rm').value.split('-').map(Number);
    $('rf').value = ymd(new Date(y, m - 2, 21)); $('rt').value = ymd(new Date(y, m - 1, 21));
  }
}
$('rd').value = ymd(new Date()); $('rm').value = ymd(new Date()).slice(0, 7); period();
$('rp').onchange = $('rd').onchange = $('rm').onchange = period;
$('rf').onchange = $('rt').onchange = () => { $('rp').value = 'c'; period(); };

const tbl = (h, r) => `<table><thead><tr>${h.map(x => `<th>${x}`).join('')}</tr></thead><tbody>${r.map(c => `<tr>${c.map(x => `<td>${esc(x)}`).join('')}</tr>`).join('') || `<tr><td colspan="${h.length}">لا توجد بيانات</tr>`}</tbody></table>`;
function render(k, rows) {
  if (k === 'att') return tbl(['التاريخ', 'الكود', 'الاسم', 'القسم', 'الحضور', 'الانصراف', 'الساعات', 'عدد البصمات'],
    rows.map(r => [r.d, r.code, r.name, r.dept || '-', r.t_in, r.t_out, hm(r.hours), r.n]));
  const g = new Map();
  if (k === 'pun') {
    for (const r of rows) {
      const key = r.code + '|' + r.d;
      if (!g.has(key)) g.set(key, [r.d, r.code, r.name, r.dept || '-', []]);
      g.get(key)[4].push(r.tm);
    }
    return tbl(['التاريخ', 'الكود', 'الاسم', 'القسم', 'البصمات'], [...g.values()].map(x => [...x.slice(0, 4), x[4].join('   ')]));
  }
  for (const r of rows) {
    let s = g.get(r.code);
    if (!s) g.set(r.code, s = { code: r.code, name: r.name, dept: r.dept || '-', days: 0, h: 0, n: 0 });
    s.days++; s.h += r.hours; s.n += r.n;
  }
  return tbl(['الكود', 'الاسم', 'القسم', 'أيام الحضور', 'إجمالي الساعات', 'عدد البصمات'], [...g.values()].map(s => [s.code, s.name, s.dept, s.days, hm(s.h), s.n]));
}
$('go').onclick = run(async () => {
  if (!$('rf').value || !$('rt').value) return say('حدد الفترة');
  const k = $('rk').value;
  const q = new URLSearchParams({ from: $('rf').value, to: $('rt').value, dept: $('rdp').value, scope: $('rs').value, code: $('rc').value, kind: k === 'pun' ? 'punches' : 'days' });
  const rows = await api('/report?' + q);
  $('ptitle').textContent = `تقرير ${$('rk').selectedOptions[0].text} من ${$('rf').value} إلى ${$('rt').value}` + ($('rdp').value ? ` — قسم ${$('rdp').value}` : '');
  $('rb').innerHTML = render(k, rows);
});
$('pr').onclick = () => window.print();

// ---------- 4) غير المسجلين ----------
async function loadUnknown() {
  const u = await api('/unknown');
  $('ub').innerHTML = u.map(x => `<tr><td>${esc(x.code)}<td>${x.n}<td>${x.first_at}<td>${x.last_at}<td><button data-a="${esc(x.code)}">إضافة كموظف</button> <button class="s" data-r="${esc(x.code)}" data-f="${x.first_at}" data-l="${x.last_at}">تقرير</button></tr>`).join('')
    || '<tr><td colspan="5">كل الأكواد مسجلة ✅</tr>';
}
$('ub').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.a) { show('t1'); $('ec').value = b.dataset.a; $('en').focus(); return; }
  show('t3'); $('rp').value = 'c'; period();
  $('rf').value = b.dataset.f; $('rt').value = b.dataset.l;
  $('rs').value = 'unknown'; $('rc').value = b.dataset.r; $('rk').value = 'att';
  $('go').click();
};

// ---------- 5) المستخدمين + الدخول ----------
async function loadUsers() {
  const u = await api('/users');
  $('usb').innerHTML = u.map(x => { const n = esc(x.username), adm = x.role === 'admin'; return `<tr><td>${n}<td>${adm ? 'مدير' : 'مستخدم عادي'}<td>${x.active ? 'نشط' : 'موقوف'}<td>`
    + `<button class="s" data-a="pw" data-u="${n}">كلمة السر</button> `
    + `<button class="s" data-a="role" data-u="${n}" data-v="${adm ? 'viewer' : 'admin'}">${adm ? 'اجعله عادي' : 'اجعله مدير'}</button> `
    + `<button class="s" data-a="act" data-u="${n}" data-v="${x.active ? 0 : 1}">${x.active ? 'إيقاف' : 'تفعيل'}</button> `
    + `<button class="d" data-a="del" data-u="${n}">حذف</button></tr>`; }).join('');
}
$('usb').onclick = run(async e => {
  const b = e.target.closest('button'); if (!b) return;
  const u = b.dataset.u, a = b.dataset.a, p = '/users/' + encodeURIComponent(u);
  if (a === 'pw') { const w = prompt('كلمة السر الجديدة لـ ' + u + ' (8 حروف على الأقل):'); if (!w) return; await api(p, 'PUT', { password: w }); say('✅ تم تغيير كلمة السر'); }
  else if (a === 'role') await api(p, 'PUT', { role: b.dataset.v });
  else if (a === 'act') await api(p, 'PUT', { active: b.dataset.v === '1' });
  else if (a === 'del' && confirm('حذف المستخدم ' + u + '؟')) await api(p, 'DELETE');
  await loadUsers();
});
$('nadd').onclick = run(async () => {
  await api('/users', 'POST', { username: $('nu').value, password: $('np').value, role: $('nr').value });
  $('nu').value = $('np').value = ''; await loadUsers(); say('✅ تم إضافة المستخدم');
});

function showLogin() { $('app').classList.add('hide'); $('login').classList.remove('hide'); $('lp').value = ''; $('lu').focus(); }
async function enter(u) {
  const adm = u.role === 'admin';
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  $('who').textContent = u.username + (adm ? ' (مدير)' : '');
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('hide', !adm && b.dataset.t !== 't3'));
  show(adm ? 't1' : 't3');
  await loadEmps();
}
$('lg').onclick = async () => {
  try { $('lm').textContent = ''; await enter(await api('/login', 'POST', { username: $('lu').value, password: $('lp').value })); }
  catch (e) { $('lm').textContent = e.message; }
};
$('lp').onkeydown = e => { if (e.key === 'Enter') $('lg').click(); };
$('lo').onclick = async () => { await api('/logout', 'POST').catch(() => {}); showLogin(); };
(async () => { try { await enter(await api('/me')); } catch { showLogin(); } })();
</script>
</body>
</html>
